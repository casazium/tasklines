name: Bug report
description: Something in Tasklines doesn't work as it should
labels: [bug]
body:
    - type: markdown
      attributes:
          value: |
              Thanks for reporting this. For ideas and questions, please use [Discussions](https://github.com/casazium/tasklines/discussions).

              Please remove anything private from what you paste here. Issues are public.
    - type: dropdown
      id: note-changed
      attributes:
          label: Did Tasklines change or lose text in a note?
          description: If yes, this gets looked at first. File recovery in Obsidian's core plugins can usually bring back the earlier version.
          options:
              - 'No'
              - 'Yes'
              - Not sure
      validations:
          required: true
    - type: textarea
      id: what
      attributes:
          label: What happened?
          description: And what did you expect instead?
      validations:
          required: true
    - type: textarea
      id: steps
      attributes:
          label: Steps to reproduce
          placeholder: |
              1. Open a base with a Tasklines view
              2. Click the due date of a task
              3. ...
      validations:
          required: true
    - type: textarea
      id: line
      attributes:
          label: The exact task line
          description: Copy it from the note in source mode, since small details matter. Change private words, but keep the symbols, dates and spacing.
          render: markdown
          placeholder: '- [ ] Example task ⏫ 📅 2026-12-01'
    - type: textarea
      id: base
      attributes:
          label: The view's .base file (if relevant)
          description: Open the file in a text editor and paste it here. Remove anything private.
          render: yaml
    - type: textarea
      id: debug
      attributes:
          label: Debug info
          description: "In Obsidian, open the command palette, run **Tasklines: Copy debug info**, and paste here. It has versions and settings, and no note content."
          render: text
      validations:
          required: true
    - type: textarea
      id: extra
      attributes:
          label: Anything else?
          description: Screenshots, or errors from the developer console.
