name: Release Obsidian plugin

on:
    push:
        tags:
            - '*'

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Check tag matches manifest and package versions
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  manifest=$(node -p "require('./manifest.json').version")
                  pkg=$(node -p "require('./package.json').version")
                  mapped=$(node -p "require('./versions.json')['$tag'] || ''")
                  echo "tag=$tag manifest=$manifest package=$pkg versions.json=$mapped"
                  # Obsidian requires the tag to be exactly the manifest version, with no "v" prefix.
                  [ "$tag" = "$manifest" ] || { echo "::error::Tag $tag does not match manifest.json version $manifest"; exit 1; }
                  [ "$tag" = "$pkg" ] || { echo "::error::Tag $tag does not match package.json version $pkg"; exit 1; }
                  [ -n "$mapped" ] || { echo "::error::versions.json has no entry for $tag"; exit 1; }

            - name: Build, lint and test
              run: |
                  npm ci
                  npm run build
                  npm run lint
                  npm test

            - name: Check for optional styles
              id: styles
              run: |
                  [ -f styles.css ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  # 0.x and x.y.z-something are pre-releases: installable with BRAT,
                  # not offered by Obsidian's community plugin browser.
                  prerelease=""
                  case "$tag" in 0.*|*-*) prerelease="--prerelease" ;; esac

                  # Drafts are published by hand after checking the notes and assets.
                  gh release create "$tag" \
                    --title="Tasklines $tag" \
                    --draft $prerelease \
                    --generate-notes \
                    main.js manifest.json ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}
